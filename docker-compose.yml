# juiced.team -- eigener Stack neben ~/archiv (kenzxo.dev).
# HTTPS macht der Caddy aus dem archiv-Stack; er erreicht "juiced-web" über das Netz "juiced_edge".
#   Starten / Update:  docker compose up -d --build
name: juiced

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juiced
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      POSTGRES_DB: juiced
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juiced -d juiced"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: prod
      DATABASE_URL: postgresql://juiced:${DB_PASSWORD}@db:5432/juiced
      PUBLIC_URL: https://juiced.team
      VOD_DIR: /data/vods
      VOD_UPLOAD_DIR: /data/uploads
    volumes:
      - ${VOD_HOST_DIR:-./data/vods}:/data/vods
      - ./data/uploads:/data/uploads   # laufende Uploads auf der lokalen Platte (schnell)
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  web:
    build: ./web
    restart: unless-stopped
    volumes:
      - ${VOD_HOST_DIR:-./data/vods}:/srv/vods:ro
    depends_on:
      - api
    networks:
      default:
      edge:
        aliases: [juiced-web]
    deploy:
      resources:
        limits:
          memory: 256m

  # nächtliches Datenbank-Backup (siehe backup.sh); Ziel per BACKUP_HOST_DIR, z. B. die Storage Box
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: juiced
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: juiced
      TZ: Europe/Berlin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REQUIRE_MARKER: ${BACKUP_REQUIRE_MARKER:-0}
    volumes:
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups
      - ./backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # Überwachung: schickt dem Owner (OWNER_DISCORD_IDS) eine Discord-DM, wenn etwas nicht läuft (siehe monitor/monitor.py)
  monitor:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "-u", "/monitor.py"]
    environment:
      TZ: Europe/Berlin
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      OWNER_DISCORD_IDS: ${OWNER_DISCORD_IDS:-}
      VOD_REQUIRE_MARKER: ${VOD_REQUIRE_MARKER:-0}
      BACKUP_REQUIRE_MARKER: ${BACKUP_REQUIRE_MARKER:-0}
    volumes:
      - ./monitor/monitor.py:/monitor.py:ro
      - ${VOD_HOST_DIR:-./data/vods}:/vods:ro
      - ${BACKUP_HOST_DIR:-./data/backups}:/backups:ro
      - ./data/uploads:/uploads:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  db_data:

networks:
  edge:
    name: juiced_edge
